function resetForm(){editingId=null;for(const k of ['sample_id','position','depthStep','depth','receipt','soil','color','moisture','notes'])$(k).value='';$('date').value=dateStr();$('surveyTime').value=timeStr();document.querySelectorAll('input[name=odor]').forEach(e=>e.checked=false);for(const k of ['sitePhoto','soilPhoto'])$(k).value='';sitePhoto=soilPhoto=audioBlob=null;soilRevision++;analyzedRevision=-1;voicePromise=null;showPhoto('prevSite',null);showPhoto('prevSoil',null);$('audio').hidden=true;$('audio').removeAttribute('src');$('aiStatus').textContent='';$('voiceStatus').textContent='';$('confidence').textContent='';$('saveStatus').textContent='';$('retryAI').hidden=true;$('retryVoice').hidden=true} $('newSample').onclick=()=>{if(confirm('새 시료를 입력할까요? 저장하지 않은 수정 내용은 사라집니다.')){resetForm();window.scrollTo(0,0)}};
function showScreen(lookup){$('entryScreen').hidden=lookup;$('lookupScreen').hidden=!lookup;$('heading').textContent=lookup?'← 시료 조회':'⚗ 토양 시료 현장 기록';window.scrollTo(0,0)}function formatDepth(r){return (r.depthStep?r.depthStep+'심도':'')+(r.depth?' / '+r.depth+'m':'')}
async function search(){const q=$('lookupId').value.trim().toLowerCase(),all=await getAll();let rows=all.map(normalizeRecord).filter(r=>q?String(r.sample_id||'').toLowerCase().includes(q):r.savedDate===dateStr());rows.sort((a,b)=>(b.updatedAt||b.savedDate+'T'+(b.savedTime||'')).localeCompare(a.updatedAt||a.savedDate+'T'+(a.savedTime||'')));$('lookupResults').replaceChildren();$('lookupInfo').textContent=q?`시료번호 검색 결과 ${rows.length}건`:`오늘 저장한 시료 ${rows.length}건`;selectedId=null;for(const r of rows){const item=document.createElement('label');item.className='item';const radio=document.createElement('input');radio.type='radio';radio.name='selectedRecord';radio.value=r.id;radio.onchange=()=>{selectedId=r.id;document.querySelectorAll('.item').forEach(e=>e.classList.remove('selected'));item.classList.add('selected')};const d=document.createElement('div');d.className='detail';const strong=document.createElement('strong');strong.textContent=normalizeRecord(r).sample_id||'(번호 없음)';const sub=document.createElement('div');sub.textContent=[r.date||r.savedDate,r.receipt||'',formatDepth(r),r.soil||'',r.color||'',r.moisture||''].filter(Boolean).join(' · ');d.append(strong,sub);item.append(radio,d);$('lookupResults').append(item)}if(!rows.length){const p=document.createElement('p');p.className='muted';p.textContent=q?'검색된 시료가 없습니다.':'오늘 저장된 시료가 없습니다. 시료번호를 입력하면 이전 기록도 검색됩니다.';$('lookupResults').append(p)}}$('openLookup').onclick=()=>{showScreen(true);$('lookupId').value='';search()};$('lookupBtn').onclick=search;$('lookupId').onkeydown=e=>{if(e.key==='Enter')search()};$('closeLookup').onclick=()=>showScreen(false);
$('apply').onclick=async()=>{if(!selectedId)return alert('적용할 시료를 선택하세요.');try{const raw=await getOne(selectedId);const r=raw?normalizeRecord(raw):null;if(!r)return alert('시료를 찾을 수 없습니다.');editingId=r.id;for(const k of fields)if(r[k]!==undefined&&r[k]!==null){if(['soil','color','moisture'].includes(k))setSelection(k,r[k]);else $(k).value=String(r[k])}if(!r.surveyTime)$('surveyTime').value=(r.savedTime||timeStr()).slice(0,5);document.querySelectorAll('input[name=odor]').forEach(e=>e.checked=e.value===r.odor);sitePhoto=r.sitePhoto||null;soilPhoto=r.soilPhoto||null;audioBlob=r.audio||null;audioMime=r.audioMime||'';showPhoto('prevSite',sitePhoto);showPhoto('prevSoil',soilPhoto);$('audio').hidden=!audioBlob;if(audioBlob)$('audio').src=URL.createObjectURL(audioBlob);else $('audio').removeAttribute('src');soilRevision++;analyzedRevision=r.aiDone==='예'?soilRevision:-1;$('aiStatus').textContent='저장된 시료를 불러왔습니다.';$('saveStatus').textContent='기존 시료 수정 중 · 저장하면 원본 기록이 갱신됩니다.';$('voiceStatus').textContent='';showScreen(false)}catch(e){alert('불러오기 실패: '+e.message)}};

$('deleteAll').onclick=async()=>{try{const rows=await getAll();if(!rows.length){alert('삭제할 시료가 없습니다.');return}$('deleteCount').textContent=String(rows.length);$('deleteStatus').textContent='';$('deleteDialog').hidden=false}catch(e){alert('저장된 시료 확인 실패: '+e.message)}};
$('cancelDelete').onclick=()=>$('deleteDialog').hidden=true;
$('confirmDelete').onclick=async()=>{const btn=$('confirmDelete');if(btn.disabled)return;btn.disabled=true;$('cancelDelete').disabled=true;$('deleteStatus').textContent='삭제 중…';try{await clearAllSamples();selectedId=null;resetForm();await refreshCount();$('lookupId').value='';await search();$('deleteDialog').hidden=true;alert('모든 시료 정보가 삭제되었습니다. 다운로드한 백업 ZIP 파일은 그대로 유지됩니다.')}catch(e){$('deleteStatus').textContent='삭제 실패: '+e.message}finally{btn.disabled=false;$('cancelDelete').disabled=false}};
function blobDataURL(blob){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=()=>rej(reader.error);reader.readAsDataURL(blob)})}
function saveDownload(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
$('backup').onclick=async()=>{const btn=$('backup');if(btn.disabled)return;btn.disabled=true;const prior=btn.textContent;btn.textContent='백업 준비 중…';try{if(typeof JSZip==='undefined'||typeof XlsxExport==='undefined')throw Error('백업 모듈을 불러오지 못했습니다.');const rows=(await getAll()).map(normalizeRecord);if(!rows.length){alert('백업할 시료가 없습니다.');return}const zip=new JSZip(),photos=zip.folder('사진'),audioFolder=zip.folder('녹음'),jsonRows=[];for(let i=0;i<rows.length;i++){const r=rows[i],item={...r};for(const [key,folder,ext] of [['sitePhoto',photos,'jpg'],['soilPhoto',photos,'jpg'],['audio',audioFolder,(r.audioMime||'').includes('mp4')?'m4a':'webm']]){const blob=r[key];if(blob instanceof Blob){const name=String(i+1).padStart(4,'0')+'_'+key+'.'+ext;folder.file(name,blob);item[key]=await blobDataURL(blob)}else item[key]=null}jsonRows.push(item)}zip.file('데이터베이스.json',JSON.stringify({format:'boringlog-backup',version:2,createdAt:new Date().toISOString(),records:jsonRows},null,2));zip.file('시료목록.xlsx',await XlsxExport.build(rows));const result=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:3}});saveDownload(result,dateStr()+'.zip');$('saveStatus').textContent=`전체 ${rows.length}건 백업 파일을 다운로드했습니다.`}catch(e){alert('백업 실패: '+e.message)}finally{btn.disabled=false;btn.textContent=prior}};
refreshCount().catch(e=>$('saveStatus').textContent='저장소 오류: '+e.message);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script><script src="/jszip.min.js"></script><script src="/xlsx-export.js"></script></body></html>
