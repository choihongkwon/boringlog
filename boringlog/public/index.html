<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17665b"><link rel="manifest" href="/manifest.webmanifest"><title>보링로그 현장 기록지</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#17342d;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#17665b;color:white;padding:18px}header h1{font-size:22px;margin:0}header p{margin:5px 0 0;font-size:13px}.wrap{max-width:750px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 7px #0001}h2{font-size:17px;margin:0 0 12px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border:1px solid #d2dfda;border-radius:10px;padding:8px}.photo img{width:100%;height:145px;object-fit:contain;background:#edf3f0}.photo label{font-weight:700;font-size:13px;display:block;margin-bottom:7px}input[type=file]{max-width:100%;font-size:12px}label.field{display:block;font-size:13px;font-weight:650;margin:11px 0 4px}input:not([type=file]),textarea,select{width:100%;border:1px solid #bdcfc8;border-radius:8px;padding:11px;font-size:16px;background:white}textarea{min-height:110px}button{border:0;border-radius:9px;padding:12px 14px;background:#17665b;color:white;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.full{width:100%;margin:9px 0}.secondary{background:#526f66}.danger{background:#984b4b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.note{font-size:12px;color:#52645f;line-height:1.5}.status{padding:10px;background:#e9f3ef;border-radius:8px;white-space:pre-wrap;font-size:13px;line-height:1.5}.row{display:flex;gap:8px}.row button{flex:1}.radio{display:flex;gap:26px;padding:10px 0}audio{width:100%;margin-top:9px}.muted{font-size:12px;color:#65726d}.record{padding:10px 0;border-bottom:1px solid #e5ebe8;font-size:14px}.record:last-child{border:0}@media(max-width:390px){.photo img{height:120px}.row button{padding:10px 6px}}
#authScreen{position:fixed;inset:0;background:#f1f5f3;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}#authScreen[hidden]{display:none}#authScreen .card{width:min(380px,100%);padding:26px}#authError{color:#a32929;font-size:13px;min-height:20px}#logout{float:right;background:#24534b;padding:7px 10px;font-size:12px}
</style></head><body><div id="authScreen"><div class="card"><h2>보링로그</h2><p>접근번호를 입력하세요</p><form id="authForm"><input id="authPin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" minlength="6" maxlength="12" autocomplete="off" required><button class="full" type="submit">확인</button></form><div id="authError" role="alert"></div></div></div><header><button id="logout" type="button">잠금</button><h1>보링로그 현장 기록지</h1><p>사진 · 음성 기록 · 날짜별 엑셀</p></header><main class="wrap">
<section class="card"><h2>① 현장 사진</h2><div class="photos"><div class="photo"><label for="sitePhoto">시료채취 사진</label><img id="prevSite" alt="사진 미선택"><input type="file" id="sitePhoto" accept="image/*" capture="environment"></div><div class="photo"><label for="soilPhoto">시료판독 사진</label><img id="prevSoil" alt="사진 미선택"><input type="file" id="soilPhoto" accept="image/*" capture="environment"></div></div><button id="analyze" class="full">사진 판독</button><div id="aiStatus" class="status"></div></section>
<section class="card"><h2>② 시료 정보</h2><label class="field" for="project">용역명</label><input id="project" value="통영 폐조선소부지 정화검증"><label class="field" for="client">의뢰자</label><input id="client" value="LH한국토지주택공사 경남지역본부"><div class="grid"><div><label class="field" for="station">조사지점</label><input id="station"></div><div><label class="field" for="sample_id">시료번호</label><input id="sample_id"></div><div><label class="field" for="position">채취 위치</label><select id="position"><option value="">선택</option><option>법면</option><option>바닥면</option></select></div><div><label class="field" for="depthStep">심도 단계</label><input type="number" min="1" step="1" id="depthStep"></div><div><label class="field" for="depth">실제 심도(m) · 수정 가능</label><input type="number" step="0.1" id="depth"></div><div><label class="field" for="depthStart">심도 시작(m) · 선택</label><input type="number" step="0.1" id="depthStart"></div><div><label class="field" for="depthEnd">심도 종료(m) · 선택</label><input type="number" step="0.1" id="depthEnd"></div><div><label class="field" for="date">조사일자</label><input type="date" id="date"></div><div><label class="field" for="receipt">접수번호</label><input id="receipt"></div><div><label class="field" for="soil">토성 (육안 추정)</label><input id="soil"></div><div><label class="field" for="color">색상</label><input id="color"></div><div><label class="field" for="moisture">수분</label><input id="moisture"></div></div><label class="field">취기</label><div class="radio"><label><input type="radio" name="odor" value="유"> 유</label><label><input type="radio" name="odor" value="무"> 무</label></div><label class="field" for="notes">특이사항 (직접 입력·수정 가능)</label><textarea id="notes"></textarea><label class="field" for="review">검토 상태</label><select id="review"><option>미검토</option><option>확인완료</option><option>수정필요</option></select><div class="muted" id="confidence"></div></section>
<section class="card"><h2>③ 특이사항 음성 입력</h2><div class="row"><button id="recStart">● 녹음 시작</button><button id="recSave" class="secondary" disabled>■ 녹음 저장</button></div><audio id="audio" controls></audio><div id="voiceStatus" class="status"></div><button id="retryVoice" class="secondary full" hidden>음성 텍스트 변환 다시 시도</button></section>
<section class="card"><h2>④ 시료 정보 저장</h2><div id="saveTime" class="status"></div><button id="save" class="full">시료 정보 저장</button><div id="saveStatus" class="note"></div><button id="newSample" class="secondary full">새 시료 입력</button></section>
<section class="card"><h2>⑤ 저장된 시료 <span id="count">(0건)</span></h2><label class="field" for="exportDate">엑셀 내보내기 날짜</label><input type="date" id="exportDate"><button id="export" class="full">선택한 날짜 XLSX 저장 (사진 포함)</button><button id="backup" class="secondary full">전체 데이터 백업 ZIP 저장 (원본 사진·녹음 포함)</button><div id="exportStatus" class="status"></div><div id="records" class="muted">아직 저장된 시료가 없습니다.</div></section>

</main><script src="/jszip.min.js"></script><script src="/xlsx-export.js"></script><script>
 'use strict';
let authToken=localStorage.getItem('boringlog_auth_token')||'';
function lockApp(){authToken='';localStorage.removeItem('boringlog_auth_token');document.getElementById('authScreen').hidden=false;document.getElementById('authPin').value='';}
async function checkAuth(){if(!authToken){lockApp();return}try{const r=await fetch('/.netlify/functions/auth',{headers:{Authorization:'Bearer '+authToken},cache:'no-store'});const j=await r.json();if(!r.ok||!j.authenticated)lockApp();else document.getElementById('authScreen').hidden=true}catch{lockApp();document.getElementById('authError').textContent='인터넷 연결 후 인증할 수 있습니다.'}}
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;document.getElementById('authError').textContent='';try{const r=await fetch('/.netlify/functions/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('authPin').value}),cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'인증 실패');authToken=j.token;localStorage.setItem('boringlog_auth_token',authToken);document.getElementById('authScreen').hidden=true;document.getElementById('authPin').value=''}catch(e){document.getElementById('authError').textContent=e.message}finally{btn.disabled=false}};
document.getElementById('logout').onclick=lockApp;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAuth()});checkAuth();
const $=id=>document.getElementById(id);const ids=['project','client','station','sample_id','position','depthStep','depth','depthStart','depthEnd','date','receipt','soil','color','moisture','notes','review'];
let siteFile=null,soilFile=null,sitePhoto=null,soilPhoto=null,soilRevision=0,analyzedRevision=-1,recorder=null,audioBlob=null,audioMime='',recordingStream=null,voicePromise=null,saving=false;
const pad=n=>String(n).padStart(2,'0');const dateStr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const timeStr=(d=new Date())=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
$('date').value=dateStr();$('exportDate').value=dateStr();
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('boringlog-daily-v2',1);q.onupgradeneeded=()=>{const store=q.result.createObjectStore('samples',{keyPath:'id'});store.createIndex('savedDate','savedDate')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function getAll(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction('samples','readonly'),q=t.objectStore('samples').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);t.oncomplete=()=>db.close()})}
async function put(r){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction('samples','readwrite');t.objectStore('samples').put(r);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function safe(s){return String(s||'조사').replace(/[^가-힣a-zA-Z0-9_-]/g,'_').slice(0,28)}
async function jpeg(file){if(!file)return null;const bmp=await createImageBitmap(file);const ratio=Math.min(1,1000/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*ratio));c.height=Math.max(1,Math.round(bmp.height*ratio));c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('사진 압축 실패')),'image/jpeg',.68))}
function depthCalc(){const n=Number($('depthStep').value),pos=$('position').value;if(Number.isInteger(n)&&n>0&&pos)$('depth').value=(n+(pos==='법면'?-0.2:0.2)).toFixed(1)}
$('depthStep').addEventListener('input',depthCalc);$('position').addEventListener('change',depthCalc);
function photos(input,preview,isSoil){$(input).onchange=async()=>{const file=$(input).files[0]||null;try{const blob=file?await jpeg(file):null;if(isSoil){soilFile=file;soilPhoto=blob;soilRevision++;analyzedRevision=-1;for(const k of ['soil','color','moisture'])$(k).value='';$('aiStatus').textContent=''}else{siteFile=file;sitePhoto=blob}if(blob)$(preview).src=URL.createObjectURL(blob);else $(preview).removeAttribute('src')}catch(e){alert(e.message)}}};photos('sitePhoto','prevSite',false);photos('soilPhoto','prevSoil',true);
$('analyze').onclick=async()=>{if(!soilPhoto)return alert('시료판독 사진을 먼저 촬영하세요.');if(!authToken)return lockApp();const rev=soilRevision;$('analyze').disabled=true;$('aiStatus').textContent='AI 판독 중…';try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(soilPhoto)});const r=await fetch('/.netlify/functions/analyze',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},body:JSON.stringify({image:b64})});const j=await r.json();if(r.status===401){lockApp();throw Error('PIN 변경 또는 인증 만료. 다시 로그인하세요.')}if(!r.ok)throw Error(j.error||'API 오류');if(rev!==soilRevision)throw Error('판독 도중 사진이 변경됨');for(const k of ['sample_id','station','receipt','soil','color','moisture'])if(j.data[k])$(k).value=j.data[k];if(j.data.depth){const n=Number(String(j.data.depth).replace(/[^0-9.]/g,''));if(Number.isFinite(n)&&n>0){$('depth').value=n.toFixed(1);const rounded=Math.round(n);const offset=Math.round((n-rounded)*10)/10;const pos=offset===-0.2?'법면':offset===0.2?'바닥면':'';if(pos){if(j.data.position&&j.data.position!==pos){$('aiStatus').textContent='글자와 숫자가 다릅니다. 채취 위치를 확인하세요.'}else $('position').value=pos;$('depthStep').value=rounded}}}if(j.data.position&&['법면','바닥면'].includes(j.data.position)){$('position').value=j.data.position;if($('depthStep').value&&!j.data.depth)depthCalc()}if(j.data.depth_step&&!$('depthStep').value){const v=Number(j.data.depth_step);if(Number.isInteger(v)&&v>0){$('depthStep').value=v;depthCalc()}}if(j.data.notes)$('notes').value=[$('notes').value,j.data.notes].filter(Boolean).join('\n');analyzedRevision=rev;$('confidence').textContent='AI 신뢰도: '+(j.data.confidence||'미표시');if(!$('aiStatus').textContent.includes('다릅니다'))$('aiStatus').textContent='판독 완료'}catch(e){$('aiStatus').textContent='판독 실패: '+e.message}finally{$('analyze').disabled=false}};
$('recStart').onclick=async()=>{try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];audioMime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';recorder=new MediaRecorder(recordingStream,audioMime?{mimeType:audioMime}:undefined);audioMime=recorder.mimeType||'audio/webm';audioBlob=null;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{audioBlob=new Blob(chunks,{type:audioMime});$('audio').src=URL.createObjectURL(audioBlob);recordingStream.getTracks().forEach(t=>t.stop());voicePromise=transcribe()};recorder.start();$('recStart').disabled=true;$('recSave').disabled=false;$('voiceStatus').textContent='녹음 중…'}catch(e){alert('마이크 권한 확인: '+e.message)}};
$('recSave').onclick=()=>{if(recorder?.state==='recording')recorder.stop();$('recStart').disabled=false;$('recSave').disabled=true;$('voiceStatus').textContent='녹음 저장 및 텍스트 변환 중…'};
async function transcribe(){if(!audioBlob)return;$('retryVoice').hidden=false;$('retryVoice').disabled=true;try{if(!authToken)throw Error('다시 인증하세요.');const type=audioMime.includes('mp4')?'mp4':audioMime.includes('ogg')?'ogg':'webm';const form=new FormData();form.append('audio',audioBlob,'recording.'+type);const r=await fetch('/.netlify/functions/transcribe',{method:'POST',headers:{'Authorization':'Bearer '+authToken},body:form});const j=await r.json();if(r.status===401){lockApp();throw Error('PIN 변경 또는 인증 만료. 다시 로그인하세요.')}if(!r.ok)throw Error(j.error||'음성 인식 실패');if(j.text)$('notes').value=[$('notes').value.trim(),j.text.trim()].filter(Boolean).join('\n');$('voiceStatus').textContent=j.text?'음성 텍스트 변환 완료. 특이사항에서 확인하세요.':'인식된 음성이 없습니다.'}catch(e){$('voiceStatus').textContent='변환 실패: '+e.message}finally{$('retryVoice').disabled=false}}$('retryVoice').onclick=()=>voicePromise=transcribe();
async function refresh(){const all=await getAll();const selected=$('exportDate').value;const day=all.filter(r=>r.savedDate===selected);$('count').textContent=`(전체 ${all.length}건 / 선택 날짜 ${day.length}건)`;$('records').replaceChildren();for(const r of day.slice(-30).reverse()){const d=document.createElement('div');d.className='record';d.textContent=`${r.savedTime} | ${r.sample_id} | ${r.depthStep||'?'}심도 / ${r.depth||'?'}m | ${r.position} | ${r.review}`;$('records').append(d)}if(!day.length)$('records').textContent='선택 날짜에 저장된 시료가 없습니다.'} $('exportDate').onchange=refresh;
$('save').onclick=async()=>{if(saving)return;if(!$('sample_id').value.trim())return alert('시료번호를 입력하세요.');if(!$('position').value||!$('depth').value)return alert('채취 위치와 심도를 입력하세요.');if(!sitePhoto||!soilPhoto)return alert('사진 2장을 모두 선택하세요.');if(recorder?.state==='recording')return alert('녹음 저장을 먼저 누르세요.');if(voicePromise)await voicePromise;if(analyzedRevision!==soilRevision&&!confirm('AI 판독하지 않은 사진입니다. 수동 입력 정보로 저장할까요?'))return;saving=true;$('save').disabled=true;try{const now=new Date(),r={id:crypto.randomUUID(),savedDate:dateStr(now),savedTime:timeStr(now),sitePhoto,soilPhoto,audio:audioBlob,audioMime,aiDone:analyzedRevision===soilRevision?'예':'아니오'};for(const k of ids)r[k]=$(k).value;for(const k of ['depth','depthStart','depthEnd','depthStep'])r[k]=r[k]===''?'':Number(r[k]);r.odor=document.querySelector('input[name=odor]:checked')?.value||'';await put(r);$('saveTime').textContent=`저장 완료: ${r.savedDate} ${r.savedTime} / ${r.sample_id} / ${r.depth}m`;$('saveStatus').textContent='휴대전화 내부 DB에 저장되었습니다. 날짜별 XLSX 저장 버튼으로 내보내세요.';$('exportDate').value=r.savedDate;await refresh()}catch(e){$('saveStatus').textContent='저장 실패: '+e.message+' (휴대전화 저장공간 확인)'}finally{saving=false;$('save').disabled=false}};
$('export').onclick=async()=>{const date=$('exportDate').value;const all=(await getAll()).filter(r=>r.savedDate===date);if(!all.length)return alert('해당 날짜에 저장된 시료가 없습니다.');$('export').disabled=true;$('exportStatus').textContent=`${all.length}건 XLSX 생성 중…`;try{const blob=await XlsxExport.build(all);download(blob,`${date}_${safe(all[0].project)}_시료정보.xlsx`);$('exportStatus').textContent=`${all.length}건 엑셀 다운로드 요청 완료. 휴대전화 다운로드 폴더를 확인하세요.`}catch(e){$('exportStatus').textContent='엑셀 생성 실패: '+e.message}finally{$('export').disabled=false}};
$('backup').onclick=async()=>{if(!confirm('모든 날짜의 원본 사진·녹음을 ZIP으로 백업할까요? 데이터가 많으면 시간이 걸립니다.'))return;const all=await getAll();if(!all.length)return alert('백업할 기록이 없습니다.');$('backup').disabled=true;$('exportStatus').textContent='전체 백업 생성 중…';try{const zip=new JSZip();const meta=[];for(const r of all){const {sitePhoto,soilPhoto,audio,...info}=r;meta.push(info);const base=`${r.savedDate}/${r.id}`;if(sitePhoto)zip.file(base+'_채취.jpg',sitePhoto);if(soilPhoto)zip.file(base+'_판독.jpg',soilPhoto);if(audio)zip.file(base+'_녹음.'+(r.audioMime?.includes('mp4')?'mp4':'webm'),audio)}zip.file('전체_시료정보.json',JSON.stringify(meta,null,2));download(await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:2}}),`보링로그_전체백업_${dateStr()}.zip`);$('exportStatus').textContent='전체 백업 ZIP 다운로드 요청 완료.'}catch(e){$('exportStatus').textContent='백업 실패: '+e.message}finally{$('backup').disabled=false}};
$('newSample').onclick=()=>{if(!confirm('다음 시료를 입력할까요? 저장하지 않은 내용은 사라집니다.'))return;for(const k of ['sample_id','depthStep','depth','depthStart','depthEnd','receipt','soil','color','moisture','notes'])$(k).value='';$('review').value='미검토';$('date').value=dateStr();document.querySelectorAll('input[name=odor]').forEach(x=>x.checked=false);for(const k of ['sitePhoto','soilPhoto'])$(k).value='';for(const k of ['prevSite','prevSoil'])$(k).removeAttribute('src');siteFile=soilFile=sitePhoto=soilPhoto=audioBlob=null;soilRevision++;analyzedRevision=-1;voicePromise=null;$('audio').removeAttribute('src');$('retryVoice').hidden=true;$('confidence').textContent='';$('aiStatus').textContent='';window.scrollTo({top:0,behavior:'smooth'})};
refresh().catch(e=>$('records').textContent='DB 오류: '+e.message);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
